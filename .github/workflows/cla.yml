# Asks first-time contributors to sign CLA.md on their pull request, and
# records each signature in signatures/version1/cla.json on main.
# https://github.com/contributor-assistant/github-action
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/Amine-AD/project-vault/blob/main/CLA.md
          # The bot commits signatures here, so this branch must allow it
          branch: main
          # The maintainer and bots don't need to sign
          allowlist: Amine-AD,dependabot[bot],renovate[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thanks for your pull request! Before it can be merged, please read
            the [Contributor License Agreement](https://github.com/Amine-AD/project-vault/blob/main/CLA.md)
            and sign it by commenting below with the sentence shown. You only
            need to do this once.
